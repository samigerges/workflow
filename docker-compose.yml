version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: workflow-postgres
    environment:
      - POSTGRES_DB=workflow
      - POSTGRES_USER=workflow
      - POSTGRES_PASSWORD=workflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: workflow-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=workflow;Username=workflow;Password=workflow
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/wwwroot/uploads
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: workflow-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pg_data:
  backend_uploads:
